<!--/*
  File:        reset-password.html
  Module:      Admin password recovery (S3b)
  Purpose:     Sets a new admin password from a valid reset link.
  Responsible: Felix Joshua H. Abing
  Created:     2026-11-24
*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Set New Admin Password')}"></head>
<body>
  <a th:replace="~{fragments :: back}"></a>
  <main class="centered">
    <div class="panel panel-small" th:unless="${validToken}">
      <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 3v6c0 5.5-3.5 9-9 11-5.5-2-9-5.5-9-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <h1>Reset link not valid</h1>
      <p class="subtitle" role="alert">This link is invalid, has expired or was already used. Please request a new one.</p>
      <p class="panel-link"><a th:href="@{/admin/forgot-password}">Request a new reset link</a></p>
    </div>

    <form class="panel panel-small" method="post" th:if="${validToken}" th:action="@{/admin/reset-password}">
      <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 3v6c0 5.5-3.5 9-9 11-5.5-2-9-5.5-9-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <h1>Set New Admin Password</h1>
      <p class="subtitle muted">Choose a strong password for your admin account</p>
      <p class="banner banner-error" role="alert" th:if="${error}" th:text="${error}"></p>
      <input type="hidden" name="token" th:value="${token}">

      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="input-group">
          <span class="input-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>
          <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" placeholder="Enter your new password" minlength="8" maxlength="72">
          <button type="button" class="reveal" aria-label="Show password" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-group">
          <span class="input-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Confirm your password" minlength="8" maxlength="72">
          <button type="button" class="reveal" aria-label="Show password" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="field-hint">Must be at least 8 characters</p>
      </div>

      <button type="submit" class="button button-wide">Reset Password</button>
      <p class="panel-link"><a th:href="@{/admin/login}">Back to Admin Sign In</a></p>
    </form>
  </main>
  <script th:src="@{/js/password-toggle.js}" defer></script>
</body>
</html>
