<!--/*
  File:        forgot-password.html
  Module:      Admin password recovery (S3b)
  Purpose:     Asks for a username or email and sends a single-use reset link.
  Responsible: Felix Joshua H. Abing
*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin Password Recovery')}"></head>
<body class="admin-page">
  <a th:replace="~{fragments :: back}"></a>
  <main class="centered">
    <form class="panel panel-small" method="post" th:action="@{/admin/forgot-password}">
      <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 3v6c0 5.5-3.5 9-9 11-5.5-2-9-5.5-9-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <h1>Admin Password Recovery</h1>
      <p class="subtitle muted">Enter your username or registered official email to receive a single-use password reset link</p>
      <p class="banner banner-ok" role="status" th:if="${message}" th:text="${message}"></p>

      <div class="field">
        <label for="identifier">Username or Admin Official Email</label>
        <div class="input-group">
          <span class="input-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 9l9 6 9-6"/></svg></span>
          <input type="text" id="identifier" name="identifier" required autocomplete="username" autocapitalize="none"
                 placeholder="Enter your username or email">
        </div>
      </div>

      <button type="submit" class="button button-wide">Send Reset Link</button>
      <p class="field-hint">Reset links are single-use and expire after 30 minutes</p>
      <p class="panel-link"><a th:href="@{/admin/login}">Back to Admin Sign In</a></p>
    </form>
  </main>
</body>
</html>
